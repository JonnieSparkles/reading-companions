name: Temporary simplify mobile map interaction PR1

on:
  push:
    branches:
      - fix/wide-wide-sea-mobile-map

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wide-wide-sea-mobile-map
      - name: Simplify tap-to-explore map behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('wide-wide-sea/index.html')
          t=p.read_text()

          t=t.replace('''\n    .map-interaction-toggle{\n      position:absolute;z-index:910;left:18px;top:92px;\n      display:none;align-items:center;justify-content:center;\n      min-height:40px;padding:8px 12px;\n      border:1px solid rgba(70,57,38,.28);border-radius:999px;\n      color:var(--ink);background:rgba(255,247,227,.96);\n      box-shadow:var(--shadow-soft);cursor:pointer;\n      font:700 10px/1 ui-sans-serif,system-ui,sans-serif;\n      touch-action:manipulation;\n    }\n    .map-stage.map-interactive .map-interaction-toggle{\n      color:#fff9ec;background:var(--rust);border-color:var(--rust);\n    }\n''','\n')
          t=t.replace('''      .map-interaction-toggle{display:inline-flex}\n''','')
          t=t.replace('''      .map-interaction-toggle{left:12px;top:84px}\n''','')
          t=t.replace('''      <button id="mapInteractionToggle" class="map-interaction-toggle" type="button" aria-pressed="false">Explore map</button>\n''','')
          t=t.replace('''    const mapInteractionToggle=document.getElementById("mapInteractionToggle");\n''','')
          t=t.replace('''        mapInteractionToggle.setAttribute("aria-pressed","false");\n        mapInteractionToggle.textContent="Explore map";\n''','')
          t=t.replace('''      mapInteractionToggle.setAttribute("aria-pressed",String(mobileMapInteractive));\n      mapInteractionToggle.textContent=mobileMapInteractive ? "Done — scroll page" : "Explore map";\n\n''','')
          t=t.replace('''      map.boxZoom.disable();\n      map.keyboard.disable();\n      map.scrollWheelZoom.disable();\n    }\n\n    mapInteractionToggle.addEventListener("click",()=>setMobileMapInteraction(!mobileMapInteractive));\n    const syncMobileMapMode=()=>setMobileMapInteraction(false);''','''      map.boxZoom.disable();\n      if(mobileMapInteractive) map.keyboard.enable();\n      else map.keyboard.disable();\n      map.scrollWheelZoom.disable();\n    }\n\n    map.getContainer().addEventListener("click",()=>{\n      if(mobileMapQuery.matches && !mobileMapInteractive) setMobileMapInteraction(true);\n    });\n    document.addEventListener("pointerdown",event=>{\n      if(!mobileMapInteractive) return;\n      if(!map.getContainer().contains(event.target)) setMobileMapInteraction(false);\n    },true);\n    const syncMobileMapMode=()=>setMobileMapInteraction(false);''')

          p.write_text(t)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-simplify-mobile-map-pr1.yml
          git add wide-wide-sea/index.html
          git commit -m "Simplify mobile map activation"
          git push origin HEAD:fix/wide-wide-sea-mobile-map
