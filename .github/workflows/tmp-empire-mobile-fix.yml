name: Temporary Empire of Blue Water mobile fix

on:
  push:
    branches:
      - fix/empire-blue-water-mobile-map

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/empire-blue-water-mobile-map
      - name: Patch mobile map behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('empire-of-blue-water/index.html')
          text = path.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match, got {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_once(
          '''.leaflet-control-attribution a{color:#719da0!important}\n\n@media(max-width:1100px) and (min-width:981px){''',
          '''.leaflet-control-attribution a{color:#719da0!important}\n\n.map-interaction-toggle{\n  position:absolute;z-index:910;left:26px;top:100px;\n  display:none;align-items:center;justify-content:center;\n  min-height:40px;padding:8px 11px;\n  border:1px solid rgba(105,181,183,.32);border-radius:0;\n  color:#a9c7c5;background:rgba(4,25,34,.94);\n  box-shadow:7px 7px 0 rgba(0,8,12,.20);cursor:pointer;\n  font:700 8px/1 "Courier New",monospace;\n  text-transform:uppercase;letter-spacing:.06em;\n  touch-action:manipulation;\n}\n.map-stage.map-interactive .map-interaction-toggle{\n  color:#071820;background:var(--brass);border-color:var(--brass);\n}\n\n@media(max-width:1100px) and (min-width:981px){''')

          replace_once(
          '''  .map-stage{grid-column:1;grid-row:2;width:100%;min-width:0;height:78vh;min-height:660px;scroll-margin-top:8px}\n  .toolbar{position:relative}''',
          '''  .map-stage{\n    grid-column:1;grid-row:2;width:100%;min-width:0;\n    height:clamp(500px,72vh,680px);\n    height:clamp(500px,72svh,680px);\n    min-height:0;scroll-margin-top:8px;\n  }\n  #map{touch-action:pan-y}\n  .map-stage.map-interactive #map{touch-action:none}\n  .map-interaction-toggle{display:inline-flex}\n  .toolbar{position:relative}''')

          replace_once(
          '''  .map-stage{height:84vh;min-height:720px}\n  .map-title{left:18px;top:16px;right:88px;width:auto}''',
          '''  .map-stage{\n    height:clamp(480px,68vh,610px);\n    height:clamp(480px,68svh,610px);\n    min-height:0;\n  }\n  .map-interaction-toggle{left:auto;right:15px;top:164px}\n  .map-title{left:18px;top:16px;right:88px;width:auto}''')

          replace_once(
          '''    <div id="map"></div>\n    <div class="map-wash"></div>''',
          '''    <div id="map"></div>\n    <button id="mapInteractionToggle" class="map-interaction-toggle" type="button" aria-pressed="false">Explore map</button>\n    <div class="map-wash"></div>''')

          replace_once(
          '''const routeLayer = L.layerGroup().addTo(map);\nconst markerLayer = L.layerGroup().addTo(map);\nconst contextLayer = L.layerGroup().addTo(map);''',
          '''const routeLayer = L.layerGroup().addTo(map);\nconst markerLayer = L.layerGroup().addTo(map);\nconst contextLayer = L.layerGroup().addTo(map);\nconst routeRenderer = L.canvas({padding:.5});''')

          replace_once(
          '''const range=$("range");\n\nfunction handleImageError(img){''',
          '''const range=$("range");\nconst mapStage=$("mapStage");\nconst mapInteractionToggle=$("mapInteractionToggle");\nconst mobileMapQuery=window.matchMedia("(max-width:980px)");\nlet mobileMapInteractive=false;\n\nfunction setMobileMapInteraction(enabled){\n  if(!mobileMapQuery.matches){\n    mobileMapInteractive=false;\n    mapStage.classList.remove("map-interactive");\n    mapInteractionToggle.setAttribute("aria-pressed","false");\n    mapInteractionToggle.textContent="Explore map";\n    map.dragging.enable();\n    map.touchZoom.enable();\n    map.doubleClickZoom.enable();\n    map.boxZoom.enable();\n    map.keyboard.enable();\n    map.scrollWheelZoom.enable();\n    return;\n  }\n\n  mobileMapInteractive=Boolean(enabled);\n  mapStage.classList.toggle("map-interactive",mobileMapInteractive);\n  mapInteractionToggle.setAttribute("aria-pressed",String(mobileMapInteractive));\n  mapInteractionToggle.textContent=mobileMapInteractive ? "Done — scroll page" : "Explore map";\n\n  if(mobileMapInteractive){\n    map.dragging.enable();\n    map.touchZoom.enable();\n    map.doubleClickZoom.enable();\n  }else{\n    map.dragging.disable();\n    map.touchZoom.disable();\n    map.doubleClickZoom.disable();\n  }\n  map.boxZoom.disable();\n  map.keyboard.disable();\n  map.scrollWheelZoom.disable();\n}\n\nmapInteractionToggle.addEventListener("click",()=>setMobileMapInteraction(!mobileMapInteractive));\nconst syncMobileMapMode=()=>setMobileMapInteraction(false);\nif(mobileMapQuery.addEventListener) mobileMapQuery.addEventListener("change",syncMobileMapMode);\nelse mobileMapQuery.addListener(syncMobileMapMode);\nsyncMobileMapMode();\n\nfunction handleImageError(img){''')

          replace_once(
          '''function routeStyle(c){\n  return {color:c.color,weight:2.4,opacity:.94,dashArray:"14 5 2 5",lineCap:"butt",lineJoin:"round"};\n}''',
          '''function routeStyle(c){\n  return {\n    renderer:routeRenderer,interactive:false,\n    color:c.color,weight:2.4,opacity:.94,dashArray:"14 5 2 5",lineCap:"butt",lineJoin:"round"\n  };\n}''')

          replace_once(
          '''  L.polyline(coords,{color:"#020b10",weight:6,opacity:.62,lineCap:"round"}).addTo(routeLayer);''',
          '''  L.polyline(coords,{renderer:routeRenderer,interactive:false,color:"#020b10",weight:6,opacity:.62,lineCap:"round"}).addTo(routeLayer);''')

          replace_once(
          '''    L.polyline(river,{color:"#58b8bf",weight:3.2,opacity:.88,lineCap:"round"}).addTo(routeLayer);''',
          '''    L.polyline(river,{renderer:routeRenderer,interactive:false,color:"#58b8bf",weight:3.2,opacity:.88,lineCap:"round"}).addTo(routeLayer);''')

          replace_once(
          '''    L.polyline(overland,{color:"#d5a84f",weight:2.6,opacity:.86,dashArray:"2 7",lineCap:"round"}).addTo(routeLayer);''',
          '''    L.polyline(overland,{renderer:routeRenderer,interactive:false,color:"#d5a84f",weight:2.6,opacity:.86,dashArray:"2 7",lineCap:"round"}).addTo(routeLayer);''')

          replace_once(
          '''  if(card && card.offsetParent!==null) card.scrollIntoView({behavior:"smooth",block:"nearest"});''',
          '''  if(window.innerWidth > 980 && card && card.offsetParent!==null){\n    card.scrollIntoView({behavior:"smooth",block:"nearest"});\n  }''')

          replace_once(
          '''setTimeout(()=>map.invalidateSize(),150);\n</script>''',
          '''let resizeFrame=null;\nconst invalidateMap=()=>{\n  if(resizeFrame) cancelAnimationFrame(resizeFrame);\n  resizeFrame=requestAnimationFrame(()=>{\n    map.invalidateSize({pan:false,debounceMoveend:true});\n    routeLayer.eachLayer(layer=>{\n      if(typeof layer.redraw==="function") layer.redraw();\n    });\n    resizeFrame=null;\n  });\n};\nsetTimeout(invalidateMap,150);\nwindow.addEventListener("resize",invalidateMap);\nwindow.addEventListener("orientationchange",()=>setTimeout(invalidateMap,120));\nif(window.visualViewport) window.visualViewport.addEventListener("resize",invalidateMap);\nif("ResizeObserver" in window) new ResizeObserver(invalidateMap).observe(mapStage);\n</script>''')

          path.write_text(text)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-empire-mobile-fix.yml
          git add empire-of-blue-water/index.html
          git commit -m "Fix Empire of Blue Water mobile map interaction"
          git push origin HEAD:fix/empire-blue-water-mobile-map
