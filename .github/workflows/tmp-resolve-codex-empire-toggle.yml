name: Temporary resolve Codex map toggle comment

on:
  push:
    branches:
      - fix/empire-blue-water-mobile-map

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/empire-blue-water-mobile-map
      - name: Move mobile map toggle clear of detail card
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('empire-of-blue-water/index.html')
          text = path.read_text()
          old = '  .map-interaction-toggle{left:auto;right:15px;top:164px}'
          new = '  .map-interaction-toggle{left:18px;right:auto;top:92px}'
          if text.count(old) != 1:
              raise SystemExit(f'expected one target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-resolve-codex-empire-toggle.yml
          git add empire-of-blue-water/index.html
          git commit -m "Keep mobile map toggle clear of detail card"
          git push origin HEAD:fix/empire-blue-water-mobile-map
