name: Temporary simplify mobile map interaction PR2

on:
  push:
    branches:
      - fix/empire-blue-water-mobile-map

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/empire-blue-water-mobile-map
      - name: Simplify tap-to-explore map behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('empire-of-blue-water/index.html')
          t=p.read_text()

          t=t.replace('''\n.map-interaction-toggle{\n  position:absolute;z-index:910;left:26px;top:100px;\n  display:none;align-items:center;justify-content:center;\n  min-height:40px;padding:8px 11px;\n  border:1px solid rgba(105,181,183,.32);border-radius:0;\n  color:#a9c7c5;background:rgba(4,25,34,.94);\n  box-shadow:7px 7px 0 rgba(0,8,12,.20);cursor:pointer;\n  font:700 8px/1 "Courier New",monospace;\n  text-transform:uppercase;letter-spacing:.06em;\n  touch-action:manipulation;\n}\n.map-stage.map-interactive .map-interaction-toggle{\n  color:#071820;background:var(--brass);border-color:var(--brass);\n}\n''','\n')
          t=t.replace('''  .map-interaction-toggle{display:inline-flex}\n''','')
          t=t.replace('''  .map-interaction-toggle{left:18px;right:auto;top:92px}\n''','')
          t=t.replace('''    <button id="mapInteractionToggle" class="map-interaction-toggle" type="button" aria-pressed="false">Explore map</button>\n''','')
          t=t.replace('''const mapInteractionToggle=$("mapInteractionToggle");\n''','')
          t=t.replace('''    mapInteractionToggle.setAttribute("aria-pressed","false");\n    mapInteractionToggle.textContent="Explore map";\n''','')
          t=t.replace('''  mapInteractionToggle.setAttribute("aria-pressed",String(mobileMapInteractive));\n  mapInteractionToggle.textContent=mobileMapInteractive ? "Done — scroll page" : "Explore map";\n\n''','')
          t=t.replace('''  map.boxZoom.disable();\n  map.keyboard.disable();\n  map.scrollWheelZoom.disable();\n}\n\nmapInteractionToggle.addEventListener("click",()=>setMobileMapInteraction(!mobileMapInteractive));\nconst syncMobileMapMode=()=>setMobileMapInteraction(false);''','''  map.boxZoom.disable();\n  if(mobileMapInteractive) map.keyboard.enable();\n  else map.keyboard.disable();\n  map.scrollWheelZoom.disable();\n}\n\nmap.getContainer().addEventListener("click",()=>{\n  if(mobileMapQuery.matches && !mobileMapInteractive) setMobileMapInteraction(true);\n});\ndocument.addEventListener("pointerdown",event=>{\n  if(!mobileMapInteractive) return;\n  if(!map.getContainer().contains(event.target)) setMobileMapInteraction(false);\n},true);\nconst syncMobileMapMode=()=>setMobileMapInteraction(false);''')

          p.write_text(t)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-simplify-mobile-map-pr2.yml
          git add empire-of-blue-water/index.html
          git commit -m "Simplify mobile map activation"
          git push origin HEAD:fix/empire-blue-water-mobile-map
